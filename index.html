<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      font-family: 'Press Start 2P', cursive;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: black;
      overscroll-behavior: none;
      touch-action: none;
    }

    #gameContainer {
      display: inline-block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      image-rendering: pixelated;
    }

    h1 {
      margin: 0;
    }

    button {
      border: 0;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #ddd;
    }

    /* --- D-pad e pulsante azione (controlli touch, sezione 10) --- */
    #touchControls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 16px;
      pointer-events: none;
      z-index: 20;
    }

    #dpad {
      position: relative;
      width: 150px;
      height: 150px;
      pointer-events: auto;
    }

    .dpadButton {
      position: absolute;
      width: 50px;
      height: 50px;
      background-color: rgba(255, 255, 255, 0.5);
      border: 2px solid black;
      border-radius: 8px;
      font-size: 20px;
    }

    #dpadUp { top: 0; left: 50px; }
    #dpadDown { top: 100px; left: 50px; }
    #dpadLeft { top: 50px; left: 0; }
    #dpadRight { top: 50px; left: 100px; }

    #actionButton {
      pointer-events: auto;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.5);
      border: 2px solid black;
      font-size: 12px;
      align-self: flex-end;
    }

    #hud {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 20;
      display: flex;
      gap: 8px;
      padding: 8px;
    }

    #hud button {
      background-color: rgba(255, 255, 255, 0.85);
      border: 2px solid black;
      border-radius: 6px;
      padding: 8px;
      font-size: 10px;
    }

    #saveFeedback {
      position: absolute;
      top: 44px;
      right: 8px;
      background-color: white;
      border: 2px solid black;
      padding: 6px 10px;
      font-size: 10px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 20;
    }

    #teamMenu {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 30;
      align-items: center;
      justify-content: center;
    }

    #teamMenuBox {
      background-color: white;
      border: 4px solid black;
      padding: 16px;
      width: 80%;
      max-width: 360px;
      max-height: 70vh;
      overflow-y: auto;
    }

    #teamList {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .teamMember {
      font-size: 10px;
      padding: 10px;
      text-align: left;
      border: 2px solid black;
      background-color: #eee;
    }

    .teamMember.active {
      background-color: #9ef29e;
    }

    .teamMember:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #closeTeamMenu {
      margin-top: 12px;
      padding: 8px 12px;
      font-size: 10px;
    }

    @media (min-width: 700px) {
      #dpad { width: 180px; height: 180px; }
      .dpadButton { width: 60px; height: 60px; }
      #dpadUp { left: 60px; }
      #dpadDown { top: 120px; left: 60px; }
      #dpadRight { left: 120px; }
      #dpadLeft { top: 60px; }
      #actionButton { width: 80px; height: 80px; }
    }
  </style>
</head>

<div id="gameContainer">
  <div
    id="overlappingDiv"
    style="
      background-color: black;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    "
  ></div>

  <canvas></canvas>

  <div id="hud">
    <button id="teamButton">Squadra</button>
    <button id="saveButton">Salva</button>
  </div>
  <div id="saveFeedback"></div>

  <div id="touchControls">
    <div id="dpad">
      <button id="dpadUp" class="dpadButton">▲</button>
      <button id="dpadLeft" class="dpadButton">◀</button>
      <button id="dpadRight" class="dpadButton">▶</button>
      <button id="dpadDown" class="dpadButton">▼</button>
    </div>
    <button id="actionButton">Azione</button>
  </div>

  <div id="teamMenu">
    <div id="teamMenuBox">
      <h1 style="font-size: 14px">La tua squadra</h1>
      <div id="teamList"></div>
      <button id="closeTeamMenu">Chiudi</button>
    </div>
  </div>

  <div
    id="characterDialogueBox"
    style="
      background-color: white;
      height: 140px;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: 4px black solid;
      display: none;
      padding: 12px;
      cursor: pointer;
      z-index: 25;
    "
  ></div>

  <div id="userInterface" style="display: none">
    <!-- Represents health bar of wild/enemy Pokémon -->
    <div
      style="
        background-color: white;
        width: 250px;
        position: absolute;
        top: 50px;
        left: 50px;
        border: 4px black solid;
        padding: 12px;
      "
    >
      <h1 id="enemyName" style="font-size: 16px">???</h1>
      <div style="position: relative">
        <div
          style="height: 5px; background-color: #ccc; margin-top: 10px"
        ></div>
        <div
          id="enemyHealthBar"
          style="
            height: 5px;
            background-color: green;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
          "
        ></div>
      </div>
    </div>

    <!-- Represents health bar of the player's active Pokémon -->
    <div
      style="
        background-color: white;
        width: 250px;
        position: absolute;
        top: 330px;
        right: 50px;
        border: 4px black solid;
        padding: 12px;
      "
    >
      <h1 id="playerName" style="font-size: 16px">???</h1>
      <div style="position: relative">
        <div
          style="height: 5px; background-color: #ccc; margin-top: 10px"
        ></div>
        <div
          id="playerHealthBar"
          style="
            height: 5px;
            background-color: green;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
          "
        ></div>
      </div>
    </div>

    <div
      style="
        background-color: white;
        height: 140px;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 4px black solid;
        display: flex;
      "
    >
      <div
        id="dialogueBox"
        style="
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          background-color: white;
          padding: 12px;
          display: none;
          cursor: pointer;
        "
      >
        sdkfjlsdajl
      </div>
      <div
        id="attacksBox"
        style="
          width: 66.66%;
          display: grid;
          grid-template-columns: repeat(2, 1fr);
        "
      ></div>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          width: 33.33%;
          border-left: 4px black solid;
        "
      >
        <h1 id="attackType" style="font-size: 16px">Attack Type</h1>
      </div>
    </div>
  </div>
</div>
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"
  integrity="sha512-6+YN/9o9BWrk6wSfGxQGpt3EUK6XeHi6yeHV+TYD2GR0Sj/cggRpXr1BrAQf0as6XslxomMUxXp2vIl+fv0QRA=="
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
></script>
<script

  crossorigin="anonymous"
  referrerpolicy="no-referrer"
></script>
