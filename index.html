<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      font-family: 'Press Start 2P', cursive;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: black;
      overscroll-behavior: none;
      touch-action: none;
    }

    #gameContainer {
      display: inline-block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      image-rendering: pixelated;
    }

    h1 {
      margin: 0;
    }

    button {
      border: 0;
      cursor: pointer;
      font-size: 16px;
    }

    button:not(.pixelButton):hover {
      background-color: #ddd;
    }

    /* --- Bottoni in stile pixel art (pacchetto "Freebuttons") ---
       I fogli sorgente hanno 3 righe che sono solo varianti di tonalità
       (stessa forma, colore diverso), non stati normale/premuto: uso un
       solo frame per forma e simulo la pressione via :active. */
    .pixelButton {
      background: transparent no-repeat center / 100% 100%;
      image-rendering: pixelated;
      color: #3a2318;
      transition: transform 0.05s ease, filter 0.05s ease;
    }

    .pixelButton:hover {
      filter: brightness(1.08);
    }

    .pixelButton:active {
      transform: scale(0.94);
      filter: brightness(0.9);
    }

    .pixelButton:disabled {
      filter: grayscale(0.6) brightness(0.85);
      cursor: not-allowed;
    }

    /* I bottoni larghi (testo) usano un border-image a 9 riquadri invece
       di uno sfondo semplicemente stirato: l'immagine sorgente è stretta
       e bassa (14x10px), quindi uno stretch uniforme su un bottone largo
       deformerebbe gli angoli arrotondati fino a "mangiarsi" il testo. */
    .pixelButton--long {
      background: none;
      border-style: solid;
      border-width: 10px;
      border-image-source: url('img/ui/freebuttons/button-long.png');
      border-image-slice: 3 fill;
      border-image-width: 10px;
      border-image-repeat: stretch;
    }

    .pixelButton--square {
      background-image: url('img/ui/freebuttons/button-square.png');
    }

    .pixelButton--round {
      background-image: url('img/ui/freebuttons/button-round.png');
    }

    /* --- D-pad e pulsante azione (controlli touch, sezione 10) --- */
    #touchControls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 16px;
      pointer-events: none;
      z-index: 20;
    }

    #dpad {
      position: relative;
      width: 150px;
      height: 150px;
      pointer-events: auto;
    }

    .dpadButton {
      position: absolute;
      width: 50px;
      height: 50px;
      font-size: 20px;
    }

    #dpadUp { top: 0; left: 50px; }
    #dpadDown { top: 100px; left: 50px; }
    #dpadLeft { top: 50px; left: 0; }
    #dpadRight { top: 50px; left: 100px; }

    #actionButton {
      pointer-events: auto;
      width: 70px;
      height: 70px;
      font-size: 12px;
      align-self: flex-end;
    }

    #hud {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 20;
      display: flex;
      gap: 8px;
      padding: 8px;
    }

    #hud button {
      padding: 2px 4px;
      font-size: 10px;
    }

    #saveFeedback {
      position: absolute;
      top: 44px;
      right: 8px;
      background-color: white;
      border: 2px solid black;
      padding: 6px 10px;
      font-size: 10px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 20;
    }

    #teamMenu {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 30;
      align-items: center;
      justify-content: center;
    }

    #teamMenuBox {
      background-color: white;
      border: 4px solid black;
      padding: 16px;
      width: 80%;
      max-width: 360px;
      max-height: 70vh;
      overflow-y: auto;
    }

    #teamList {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .teamMember {
      font-size: 10px;
      padding: 4px 10px;
      text-align: left;
      color: #3a2318;
      border-style: solid;
      border-width: 12px;
      border-image-source: url('img/ui/freebuttons/button-long.png');
      border-image-slice: 3 fill;
      border-image-width: 12px;
      border-image-repeat: stretch;
    }

    .teamMember.active {
      outline: 3px solid #2e7d32;
      outline-offset: 2px;
    }

    .teamMember:disabled {
      filter: grayscale(0.7) brightness(0.85);
      cursor: not-allowed;
    }

    #closeTeamMenu {
      margin-top: 12px;
      padding: 4px 8px;
      font-size: 10px;
    }

    /* L'overlay HTML della battaglia (barre HP, dialogo, menu attacchi) è
       scritto in coordinate fisse 1024x576 (lo spazio del canvas). Il
       canvas usa object-fit:contain e si "lettera-box-a" su schermi con
       proporzioni diverse dal 16:9 (es. i telefoni in verticale): la sua
       area disegnata è più piccola della sua box CSS a piena pagina.
       Senza sincronizzare l'overlay con quell'area effettiva, su mobile
       finisce scollegato dalla scena di battaglia (vedi
       syncBattleOverlayTransform() in index.js). */
    #userInterface {
      position: absolute;
      top: 0;
      left: 0;
      width: 1024px;
      height: 576px;
      transform-origin: top left;
    }

    @media (min-width: 700px) {
      #dpad { width: 180px; height: 180px; }
      .dpadButton { width: 60px; height: 60px; }
      #dpadUp { left: 60px; }
      #dpadDown { top: 120px; left: 60px; }
      #dpadRight { left: 120px; }
      #dpadLeft { top: 60px; }
      #actionButton { width: 80px; height: 80px; }
    }
  </style>
</head>

<div id="gameContainer">
  <div
    id="overlappingDiv"
    style="
      background-color: black;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    "
  ></div>

  <canvas></canvas>

  <div id="hud">
    <button id="teamButton" class="pixelButton pixelButton--long">Squadra</button>
    <button id="saveButton" class="pixelButton pixelButton--long">Salva</button>
  </div>
  <div id="saveFeedback"></div>

  <div id="touchControls">
    <div id="dpad">
      <button id="dpadUp" class="dpadButton pixelButton pixelButton--square">▲</button>
      <button id="dpadLeft" class="dpadButton pixelButton pixelButton--square">◀</button>
      <button id="dpadRight" class="dpadButton pixelButton pixelButton--square">▶</button>
      <button id="dpadDown" class="dpadButton pixelButton pixelButton--square">▼</button>
    </div>
    <button id="actionButton" class="pixelButton pixelButton--round">Azione</button>
  </div>

  <div id="teamMenu">
    <div id="teamMenuBox">
      <h1 style="font-size: 14px">La tua squadra</h1>
      <div id="teamList"></div>
      <button id="closeTeamMenu" class="pixelButton pixelButton--long">
        <img
          src="img/ui/freebuttons/icon-close.png"
          alt=""
          style="width: 14px; height: 14px; vertical-align: middle; image-rendering: pixelated; margin-right: 6px;"
        />Chiudi
      </button>
    </div>
  </div>

  <div
    id="characterDialogueBox"
    style="
      background-color: white;
      height: 140px;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: 4px black solid;
      display: none;
      padding: 12px;
      cursor: pointer;
      z-index: 25;
    "
  ></div>

  <div id="userInterface" style="display: none">
    <!-- Represents health bar of wild/enemy Pokémon -->
    <div
      style="
        background-color: white;
        width: 250px;
        position: absolute;
        top: 50px;
        left: 50px;
        border: 4px black solid;
        padding: 12px;
      "
    >
      <h1 id="enemyName" style="font-size: 16px">???</h1>
      <div style="position: relative">
        <div
          style="height: 5px; background-color: #ccc; margin-top: 10px"
        ></div>
        <div
          id="enemyHealthBar"
          style="
            height: 5px;
            background-color: green;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
          "
        ></div>
      </div>
    </div>

    <!-- Represents health bar of the player's active Pokémon -->
    <div
      style="
        background-color: white;
        width: 250px;
        position: absolute;
        top: 330px;
        right: 50px;
        border: 4px black solid;
        padding: 12px;
      "
    >
      <h1 id="playerName" style="font-size: 16px">???</h1>
      <div style="position: relative">
        <div
          style="height: 5px; background-color: #ccc; margin-top: 10px"
        ></div>
        <div
          id="playerHealthBar"
          style="
            height: 5px;
            background-color: green;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
          "
        ></div>
      </div>
    </div>

    <div
      style="
        background-color: white;
        height: 140px;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 4px black solid;
        display: flex;
      "
    >
      <div
        id="dialogueBox"
        style="
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          background-color: white;
          padding: 12px;
          display: none;
          cursor: pointer;
        "
      >
        sdkfjlsdajl
      </div>
      <div
        id="attacksBox"
        style="
          width: 66.66%;
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
          padding: 10px;
        "
      ></div>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          width: 33.33%;
          border-left: 4px black solid;
        "
      >
        <h1 id="attackType" style="font-size: 16px">Attack Type</h1>
      </div>
    </div>
  </div>
</div>
